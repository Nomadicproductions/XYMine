name: Reset Cache Branch Switch

on:
  push:
    branches:
      - joeyaugust1-patch-3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: write

jobs:
  reset-cache:
    runs-on: ubuntu-latest
    name: Switch Pages Branch to Reset Cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Switch Pages to branch 2 (patch-2)
        run: |
          echo "Switching GitHub Pages deployment to joeyaugust1-patch-2..."
          # First, try to update existing Pages configuration
          curl -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{
              "source": {
                "branch": "joeyaugust1-patch-2",
                "path": "/"
              }
            }' || echo "Pages source update sent for branch 2"

      - name: Wait for deployment stabilization
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

      - name: Switch Pages back to branch 3 (patch-3)
        run: |
          echo "Switching GitHub Pages deployment back to joeyaugust1-patch-3..."
          curl -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{
              "source": {
                "branch": "joeyaugust1-patch-3",
                "path": "/"
              }
            }' || echo "Pages source update sent for branch 3"

      - name: Completion notice
        run: |
          echo "Cache reset workflow completed!"
          echo "GitHub Pages should now be refreshed and serving from joeyaugust1-patch-3"
          echo "This helps reset any cached versions of your changes."