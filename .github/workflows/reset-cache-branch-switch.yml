name: Reset Cache Branch Switch

on:
  push:
    branches:
      - joeyaugust1-patch-3
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual cache reset trigger'
        required: false
        default: 'true'

permissions:
  contents: read
  pages: write
  actions: write
  metadata: read

jobs:
  reset-cache:
    runs-on: ubuntu-latest
    name: Switch Pages Branch to Reset Cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all branches
        
      - name: Verify branches exist
        run: |
          echo "Verifying that required branches exist..."
          git branch -r | grep "origin/joeyaugust1-patch-2" || (echo "❌ Branch joeyaugust1-patch-2 not found" && exit 1)
          git branch -r | grep "origin/joeyaugust1-patch-3" || (echo "❌ Branch joeyaugust1-patch-3 not found" && exit 1)
          echo "✅ Both required branches found"

      - name: Check current Pages configuration
        run: |
          echo "Checking current GitHub Pages configuration..."
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages | jq -r '.source.branch // "No Pages configured"'
        
      - name: Switch Pages to branch 2 (patch-2)
        run: |
          echo "🔄 Switching GitHub Pages deployment to joeyaugust1-patch-2..."
          response=$(curl -s -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{
              "source": {
                "branch": "joeyaugust1-patch-2",
                "path": "/"
              }
            }')
          http_code="${response: -3}"
          if [ "$http_code" = "204" ] || [ "$http_code" = "200" ]; then
            echo "✅ Successfully switched to branch 2"
          else
            echo "⚠️ Response code: $http_code - Pages update sent for branch 2"
          fi

      - name: Wait for deployment stabilization
        run: |
          echo "⏳ Waiting for deployment to stabilize..."
          sleep 30

      - name: Switch Pages back to branch 3 (patch-3)
        run: |
          echo "🔄 Switching GitHub Pages deployment back to joeyaugust1-patch-3..."
          response=$(curl -s -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{
              "source": {
                "branch": "joeyaugust1-patch-3",
                "path": "/"
              }
            }')
          http_code="${response: -3}"
          if [ "$http_code" = "204" ] || [ "$http_code" = "200" ]; then
            echo "✅ Successfully switched back to branch 3"
          else
            echo "⚠️ Response code: $http_code - Pages update sent for branch 3"
          fi

      - name: Completion notice
        run: |
          echo "🎉 Cache reset workflow completed!"
          echo "📍 GitHub Pages should now be refreshed and serving from joeyaugust1-patch-3"
          echo "🔄 This process helps reset any cached versions of your changes."
          echo "🚀 Your latest changes should now be visible with fresh cache!"